<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro Hologram</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; }

      #info {
        position: fixed;
        top: 48px;
        left: 12px;
        color: #aaa;
        font: 12px/1.6 monospace;
        pointer-events: none;
      }

      /* --- Scene toggle buttons (bottom-left) --- */
      #controls {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 100;
        display: flex;
        gap: 8px;
      }

      .ctrl-btn {
        background: rgba(255,255,255,0.07);
        color: #999;
        border: 1px solid rgba(255,255,255,0.14);
        padding: 6px 16px;
        font: 12px/1.4 monospace;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        user-select: none;
      }
      .ctrl-btn:hover {
        background: rgba(255,255,255,0.14);
        color: #ddd;
      }
      .ctrl-btn.active {
        background: rgba(255,255,255,0.20);
        color: #fff;
        border-color: rgba(255,255,255,0.38);
      }

      /* --- Depth transform panel (top-right) --- */
      #transform-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        padding: 12px 16px;
        font: 12px/1.8 monospace;
        color: #aaa;
        min-width: 230px;
        user-select: none;
      }
      #transform-panel .panel-title {
        color: #666;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      #transform-panel .transform-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .param-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .param-label {
        width: 88px;
        color: #666;
        flex-shrink: 0;
      }
      .param-val {
        width: 38px;
        text-align: right;
        color: #ddd;
        flex-shrink: 0;
      }
      .param-row input[type="range"] {
        flex: 1;
        accent-color: rgba(255,255,255,0.5);
        cursor: pointer;
      }
      .param-row input[type="number"] {
        width: 72px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 3px;
        color: #ddd;
        font: 12px/1.4 monospace;
        padding: 1px 4px;
        text-align: right;
      }
      #btn-reset {
        margin-top: 10px;
        width: 100%;
        padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Drag to orbit &nbsp;|&nbsp; Scroll to zoom<br/>
      Click VR to open Looking Glass
    </div>

    <!-- Scene toggles -->
    <div id="controls">
      <button class="ctrl-btn active" id="btn-stars">Stars</button>
      <button class="ctrl-btn" id="btn-nebula3d">3D Nebula</button>
    </div>

    <!-- Depth transform controls -->
    <div id="transform-panel">
      <div class="panel-title">Depth Transform</div>

      <div class="transform-row">
        <button class="ctrl-btn active" id="btn-log10">log10</button>
        <button class="ctrl-btn"        id="btn-linear">linear</button>
      </div>

      <div class="panel-title" style="margin-top: 4px;">XY Position</div>
      <div class="transform-row">
        <button class="ctrl-btn" id="btn-xy-raw">observed</button>
        <button class="ctrl-btn" id="btn-xy-corrected">corrected</button>
      </div>

      <div class="param-row">
        <span class="param-label">bg dist (pc)</span>
        <input type="range" id="slider-bg-dist"
               min="500" max="10000" step="50" value="3162" />
        <input type="number" id="input-bg-dist"
               min="100" step="100" value="3162" />
      </div>

      <div class="param-row">
        <span class="param-label">depth coeff</span>
        <input type="range" id="slider-depth-coef"
               min="0.01" max="0.5" step="0.01" value="0.10" />
        <input type="number" id="val-depth-coef"
               min="0.01" max="0.5" step="0.01" value="0.10" />
      </div>

      <div class="param-row">
        <span class="param-label">no-parallax-starpos</span>
        <input type="range" id="slider-no-par"
               min="0.5" max="3.0" step="0.1" value="1.2" />
        <input type="number" id="val-no-par"
               min="0.5" max="3.0" step="0.1" value="1.2" />
      </div>

      <div class="param-row">
        <span class="param-label">nebula shift</span>
        <input type="range" id="slider-nebula-shift"
               min="-500" max="500" step="10" value="0" />
        <input type="number" id="val-nebula-shift"
               min="-500" max="500" step="10" value="0" />
      </div>

      <div class="param-row">
        <span class="param-label">scene shift</span>
        <input type="range" id="slider-scene-shift"
               min="-500" max="500" step="10" value="0" />
        <input type="number" id="val-scene-shift"
               min="-500" max="500" step="10" value="0" />
      </div>

      <button class="ctrl-btn" id="btn-reset">Reset defaults</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
